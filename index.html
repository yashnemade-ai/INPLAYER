<script>
    let channels = [], movies = [], currentUrl = "", favs = JSON.parse(localStorage.getItem('favs')) || [];
        const area = document.getElementById('content-area');

        // Helper function taaki har baar fresh URL mile
        const getFreshUrl = (baseUrl) => `${baseUrl}?t=${new Date().getTime()}`;

        // LIVE TV FETCH (Auto-load on startup)
        function loadChannels() {
            const freshChannelsUrl = getFreshUrl("https://api.npoint.io/85fbd5b6462f28618069");

            fetch(freshChannelsUrl, { cache: "no-store" }) // Strictly bypass cache
                .then(r => r.json())
                .then(data => {
                    channels = Array.isArray(data) ? data : [];
                    renderChannels(channels);
                })
                .catch(e => console.error("Channels Fetch Error:", e));
        }

        // Startup call
        loadChannels();

        // MOVIES FETCH FUNCTION
        function fetchMovies() {
            area.innerHTML = "<div class='cat-title'>Loading Movies & Series...</div>";
            document.getElementById('search-box').style.display = 'none';

            const freshMoviesUrl = getFreshUrl("https://api.npoint.io/56fc751c2191cd12b672");

            fetch(freshMoviesUrl, { cache: "no-store" }) // Strictly bypass cache
                .then(r => {
                    if (!r.ok) throw new Error("Network error");
                    return r.json();
                })
                .then(data => {
                    console.log("Real-time Movies received:", data);
                    movies = Array.isArray(data) ? data : [];

                    if (movies.length === 0) {
                        area.innerHTML = "<p style='padding:20px; color:var(--text-sec);'>No movies found in JSON database.</p>";
                        return;
                    }
                    renderMovies(movies);
                })
                .catch(e => {
                    console.error("Movies Fetch Error:", e);
                    area.innerHTML = "<p style='padding:20px; color:var(--accent);'>Failed to load movies. Please check your JSON link.</p>";
                });
        }

        function renderChannels(list) {
            area.innerHTML = "";
            if(!list || list.length === 0) return;

            const cats = {};
            list.forEach(c => {
                const category = c.cat || "Other";
                if(!cats[category]) cats[category]=[];
                cats[category].push(c);
            });

            for(let k in cats) {
                const t = document.createElement('div'); t.className = 'cat-title'; t.innerText = k; area.appendChild(t);
                const g = document.createElement('div'); g.className = 'grid';
                cats[k].forEach(ch => createCard(ch, g, false));
                area.appendChild(g);
            }
        }

        let movieSliderInterval; // Slider timer store karne ke liye

let currentSlide = 0;
let totalSlides = 0;
let sliderInterval;
let startX = 0;

function renderMovies(list) {
    area.innerHTML = "";
    // Sirf un movies ko slider mein lo jinki category khali hai
    const sliderItems = list.filter(m => !m.cat || m.cat.trim() === "").slice(0, 5);
    totalSlides = sliderItems.length;

    if (totalSlides > 0) {
        const container = document.createElement('div');
        container.className = 'slider-container';
        container.id = 'mainSliderContainer';

        let slidesHtml = '';
        let dotsHtml = '';

        sliderItems.forEach((m, index) => {
            // 🔥 JSON se quality uthayega, agar nahi hai toh default "HD" dikhayega
            const qTag = m.quality || "HD";

            slidesHtml += `
                <div class="slide" onclick='openPlayer(${JSON.stringify(m)})'>
                    <div class="slide-inner focusable" tabindex="0">
                        <div class="slide-badge">${qTag}</div>
                        <img src="${m.logo}" onerror="this.src='https://via.placeholder.com/800x450'">
                        <div class="slide-overlay">
                            <div class="slide-title">${m.name}</div>
                        </div>
                    </div>
                </div>
            `;
            dotsHtml += `<div class="dot ${index === 0 ? 'active' : ''}"></div>`;
        });

        container.innerHTML = `
            <div class="slider-wrapper" id="movieSliderWrapper">${slidesHtml}</div>
            <div class="slider-dots">${dotsHtml}</div>
        `;
        area.appendChild(container);

        // --- SWIPE / TOUCH LOGIC ---
        container.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
        container.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 50) moveSlider(1); // Swipe Left -> Next
            if (startX - endX < -50) moveSlider(-1); // Swipe Right -> Prev
        });

        startAutoSlide();
    }

    // --- GRID LOGIC --- (Baaki grid render karne ka function)
    renderRemainingGrid(list);
}
function moveSlider(direction) {
    currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
    updateSliderUI();
    startAutoSlide(); // Reset timer on manual move
}

function updateSliderUI() {
    const wrapper = document.getElementById('movieSliderWrapper');
    const dots = document.querySelectorAll('.dot');
    if (wrapper) {
        wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }
}

function startAutoSlide() {
    if (sliderInterval) clearInterval(sliderInterval);
    sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        updateSliderUI();
    }, 5000);
}

function renderRemainingGrid(list) {
    const gridItems = list.filter(m => m.cat && m.cat.trim() !== "");
    const categories = {};
    gridItems.forEach(m => {
        if (!categories[m.cat]) categories[m.cat] = [];
        categories[m.cat].push(m);
    });
    for (let cat in categories) {
        const t = document.createElement('div');
        t.className = 'cat-title'; t.innerText = cat;
        area.appendChild(t);
        const g = document.createElement('div');
        g.className = 'grid';
        categories[cat].forEach(mv => createCard(mv, g, true));
        area.appendChild(g);
    }
}

// SLIDER ANIMATION FUNCTION
function setupMovieSlider(total) {
    let current = 0;
    const wrapper = document.getElementById('movieSliderWrapper');
    const dots = document.querySelectorAll('.dot');

    if (movieSliderInterval) clearInterval(movieSliderInterval);

    movieSliderInterval = setInterval(() => {
        current = (current + 1) % total;

        if (wrapper) {
            wrapper.style.transform = `translateX(-${current * 100}%)`;
            dots.forEach((d, i) => d.classList.toggle('active', i === current));
        }
    }, 5000); // Har 5 second mein slide hoga
}
function createCard(item, parentGrid, isMovie) {
    const el = document.createElement('div');

    const savedFavs = JSON.parse(localStorage.getItem('favs')) || [];
    const isFav = savedFavs.includes(item.name);

    // ✅ Badlav: 'fav' class sirf Live TV (not isMovie) ke liye hi apply hogi
    const favClass = (isFav && !isMovie) ? 'fav' : '';
    el.className = `card focusable ${isMovie ? 'movie-card' : ''} ${favClass}`;
    el.tabIndex = 0;

    let movieQuality = item.quality || "HD";
    let tag = isMovie ? `<div class="quality-tag">${movieQuality}</div>` : `<div class="live-tag">LIVE</div>`;

    // ✅ Badlav: Heart Icon ka HTML sirf Live TV ke liye add hoga
    let heartHtml = "";
    if (!isMovie) {
        heartHtml = `
            <div class="fav-indicator">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>`;
    }

    el.innerHTML = `
        ${tag}
        ${heartHtml}
        <img src="${item.logo}" class="card-logo" onerror="this.src='https://via.placeholder.com/200x300?text=TV'">
        <div class="card-name">${item.name}</div>
    `;

    // --- LONG PRESS HANDLER ---
    let pressTimer;
    let longPressed = false;

    const startPress = (e) => {
        // ✅ Badlav: Agar movie hai toh yahan se return ho jao, long press kaam nahi karega
        if (isMovie) return;

        longPressed = false;
        pressTimer = setTimeout(() => {
            toggleFav(item.name, el);
            longPressed = true;
            if (navigator.vibrate) navigator.vibrate(50);
        }, 800);
    };

    const cancelPress = () => clearTimeout(pressTimer);

    el.onmousedown = el.ontouchstart = startPress;
    el.onmouseup = el.ontouchend = el.onmouseleave = cancelPress;

    el.onclick = (e) => {
        if (!longPressed) openPlayer(item);
    };

    parentGrid.appendChild(el);
}

    // --- PLAYER TRIGGER FUNCTION ---
    function openPlayer(item) {
    // 1. Safe Check: Kya item valid hai?
    if (!item) return;

    // 2. Web Series Check (Case Insensitive)
    const category = item.cat ? item.cat.toLowerCase() : "";
    if (category === "web series" || category === "series") {
        if (item.episodes && item.episodes.length > 0) {
            showWebSeriesModal(item);
            return;
        }
    }

    // 3. Purana Logic (Movies/Live TV): Jo pehle se hai
    if (!item.url) {
        alert("Link not available!");
        return;
    }

    const url1 = item.url;
    const name = item.name;
    const url2 = item.url2 || "";

    if (window.AndroidPortal && window.AndroidPortal.launchNative) {
        window.AndroidPortal.launchNative(url1, name, url2);
    } else {
        console.log("Playing:", name, url1);
        alert("Opening Player: " + name);
    }
}


let currentOpenSeries = null;

window.currentSeriesData = null; // Global reference

function openPlayer(item) {
    if (!item) return;
    const category = (item.cat || "").toLowerCase().trim();

    // 1. Web Series Modal logic
    if (category === "web series" || category === "series") {
        if ((item.seasons && item.seasons.length > 0) || (item.episodes && item.episodes.length > 0)) {
            showWebSeriesModal(item);
            return;
        }
    }

    // 2. Movie/Live TV logic
    if (!item.url) { alert("Link not available!"); return; }
    if (window.AndroidPortal && window.AndroidPortal.launchNative) {
        window.AndroidPortal.launchNative(String(item.url), String(item.name), String(item.url2 || ""), String(item.cat || "Live"));
    }
}

function showWebSeriesModal(item) {
    window.currentSeriesData = item; // ✅ Global data save kiya
    const modal = document.getElementById('series-modal');
    const container = document.getElementById('episodes-list-container');
    const seasonSelect = document.getElementById('season-select');

    document.getElementById('series-title-display').innerText = item.name;
    document.getElementById('series-meta').innerText = `${item.genre || ''} • ${item.year || ''}`;

    modal.style.display = 'block';

    // Handle Seasons
    if (item.seasons && item.seasons.length > 0) {
        seasonSelect.style.display = "block";
        seasonSelect.innerHTML = "";
        item.seasons.forEach((s, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = s.season_name;
            seasonSelect.appendChild(opt);
        });
        renderEpisodesList(item.seasons[0].episodes);
    } else if (item.episodes) {
        seasonSelect.style.display = "none";
        renderEpisodesList(item.episodes);
    }
}

function renderEpisodesList(eps) {
    const container = document.getElementById('episodes-list-container');
    container.innerHTML = ""; // List clear karein

    if (!eps || eps.length === 0) {
        container.innerHTML = "<p style='padding:20px; color:gray;'>No episodes found.</p>";
        return;
    }

    eps.forEach((ep, index) => {
        const nextUrl = eps[index + 1] ? eps[index + 1].url : "";
        const div = document.createElement('div');
        div.className = "ep-item focusable";
        div.tabIndex = 0;

        div.innerHTML = `
            <div class="ep-thumb-box">
                <img src="${ep.thumb || window.currentSeriesData.logo}" onerror="this.src='https://via.placeholder.com/150x84'">
            </div>
            <div class="ep-info-box">
                <div style="font-size: 11px; color: var(--accent); font-weight: 800;">${ep.ep_num || 'E'+(index+1)} • ${ep.duration || ''}</div>
                <div style="font-size: 17px; font-weight: 700; color: var(--text-main);">${ep.title || 'Episode '+(index+1)}</div>
                <div style="font-size: 12px; color: var(--text-sec); line-height: 1.4; margin-top: 5px;">${ep.desc || ''}</div>
            </div>`;

        div.onclick = function() {
            if (window.AndroidPortal && window.AndroidPortal.launchNative) {
                window.AndroidPortal.launchNative(String(ep.url), String(ep.title), String(nextUrl), "Web Series");
            }
        };
        container.appendChild(div);
    });
}

function changeSeason() {
    const idx = document.getElementById('season-select').value;
    if (window.currentSeriesData && window.currentSeriesData.seasons[idx]) {
        renderEpisodesList(window.currentSeriesData.seasons[idx].episodes);
    }
}

function closeSeries() {
    document.getElementById('series-modal').style.display = 'none';
}
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('open');
            document.getElementById('sb-overlay').style.display = sb.classList.contains('open') ? 'block' : 'none';
            if(sb.classList.contains('open')) {
                sb.querySelector('.menu-item').focus(); // Sidebar open hote hi focus pehle item par
            }
        }

        // --- BACK BUTTON LOGIC ---
        function handleBackAction() {
            const sidebar = document.getElementById('sidebar');
            const searchBox = document.getElementById('search-box');
            const aboutModal = document.getElementById('about-modal');

            if (sidebar.classList.contains('open')) {
                toggleSidebar();
            } else if (aboutModal.classList.contains('show')) {
                toggleAbout();
            } else if (searchBox.style.display === 'block') {
                resetToHome();
            } else {
                // Agar sab band hai aur home par hain to app exit karein
                if (window.AndroidPortal && window.AndroidPortal.exitApp) {
                    window.AndroidPortal.exitApp();
                } else {
                    console.log("Exit App Triggered");
                }
            }
        }

        // Remote/Keypad Back Button Listener
        window.addEventListener('keydown', (e) => {
            if (e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 4) { // Backspace, Esc, ya Android Back
                if (document.activeElement.id === 'search-input' && document.activeElement.value !== "") return; // Let user delete text
                e.preventDefault();
                handleBackAction();
            }

            // --- SIDEBAR FOCUS RESTRICTION ---
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                const menuItems = sidebar.querySelectorAll('.menu-item');
                const current = document.activeElement;
                const index = Array.from(menuItems).indexOf(current);

                if (e.key === "ArrowDown" && index === menuItems.length - 1) {
                    e.preventDefault(); // Sabse neeche ruk jao
                }
                if (e.key === "ArrowUp" && index === 0) {
                    e.preventDefault(); // Sabse upar ruk jao
                }
                if (e.key === "ArrowRight") {
                    e.preventDefault(); // Sidebar ke bahar mat jao jab tak open hai
                }
            }
        });

        // Android Hardware Back Button Hook
        window.onBackPressed = handleBackAction;

function toggleFav(name, el) {
    // 1. LocalStorage se current list nikalna
    let currentFavs = JSON.parse(localStorage.getItem('favs')) || [];

    if (currentFavs.includes(name)) {
        // 2. Agar pehle se hai toh remove karo
        currentFavs = currentFavs.filter(n => n !== name);
        if (el) el.classList.remove('fav'); // Heart hatayega
    } else {
        // 3. Agar nahi hai toh add karo
        currentFavs.push(name);
        if (el) el.classList.add('fav'); // Heart dikhayega
    }

    // 4. Data save aur global variable update
    localStorage.setItem('favs', JSON.stringify(currentFavs));
    favs = currentFavs;

    // 5. Agar user "Favorites" wale page par hai, toh bina animation ke list refresh karo
    const currentTitle = document.querySelector('.cat-title');
    if (currentTitle && currentTitle.innerText === 'Favorites') {
        showFavorites();
    }
}
        function toggleAbout() { document.getElementById('about-modal').classList.toggle('show'); }

        function resetToHome() {
            document.getElementById('search-box').style.display = 'none';
            renderChannels(channels);
        }

        function showAllFlat() {
            document.getElementById('search-box').style.display = 'none';
            area.innerHTML = "<div class='cat-title'>All Channels</div><div class='grid' id='flat-grid'></div>";
            channels.forEach(ch => createCard(ch, document.getElementById('flat-grid'), false));
        }

        // ✅ FIXED: Search click karne par saara purana data (Favorites text) saaf ho jayega
        function toggleSearch() {
            const b = document.getElementById('search-box');
            const isOpening = (b.style.display === 'none' || b.style.display === '');

            if (isOpening) {
                b.style.display = 'block';
                // Screen saaf karke seedha saare channels aur movies dikhao
                area.innerHTML = "<div class='cat-title'>All Content</div><div class='grid' id='res-grid'></div>";
                const grid = document.getElementById('res-grid');
                channels.forEach(ch => createCard(ch, grid, false));
                movies.forEach(mv => createCard(mv, grid, true));

                document.getElementById('search-input').value = "";
                document.getElementById('search-input').focus();
            } else {
                resetToHome();
            }
        }

        function showFavorites() {
            document.getElementById('search-box').style.display = 'none';
            const list = channels.filter(c => favs.includes(c.name));
            area.innerHTML = "<div class='cat-title'>Favorites</div>";
            if(list.length === 0) {
                area.innerHTML += "<p style='padding:20px; color:var(--text-sec);'>Long press channel to add</p>";
            } else {
                const g = document.createElement('div');
                g.className = 'grid';
                list.forEach(ch => createCard(ch, g, false));
                area.appendChild(g);
            }
        }

        // ✅ FIXED: Live typing filter
        function doSearch() {
            const v = document.getElementById('search-input').value.toLowerCase();
            area.innerHTML = "<div class='cat-title'>Results</div><div class='grid' id='res-grid'></div>";
            const grid = document.getElementById('res-grid');

            if (v.trim() === "") {
                channels.forEach(ch => createCard(ch, grid, false));
                movies.forEach(mv => createCard(mv, grid, true));
                return;
            }

            channels.filter(c => (c.name || "").toLowerCase().includes(v)).forEach(ch => createCard(ch, grid, false));
            movies.filter(m => (m.name || "").toLowerCase().includes(v)).forEach(m => createCard(m, grid, true));
        }

        const moonIcon = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';

        // ✅ FIXED: Theme toggle par koi re-render nahi hoga, isliye data waisa hi rahega
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme-preference', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const iconBox = document.getElementById('theme-icon');
            if (iconBox) {
                iconBox.innerHTML = document.body.classList.contains('dark-theme') ? sunIcon : moonIcon;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme-preference') || 'light';
            if (savedTheme === 'dark') document.body.classList.add('dark-theme');
            updateThemeIcon();
        });
</script>
